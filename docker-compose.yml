
services:
  app:
    build: .
    image: nielldd/simple-app:latest
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PASSWORD: rootpraktikum123
      DB_NAME: simple_app
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpraktikum123
      MYSQL_DATABASE: simple_app
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
